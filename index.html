<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Slip Maker - Durga Enterprises v2.0</title>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
        }
        .add-item-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px dashed #ccc;
        }
        .add-item-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .add-item-row input {
            flex: 2;
        }
        .add-item-row input.small {
            flex: 1;
        }
        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 8px;
            width: 100%;
        }
        .voice-section {
            text-align: center;
            margin: 15px 0;
        }
        .btn-voice {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 77, 77, 0.3);
            transition: background 0.2s;
            font-weight: bold;
        }
        .btn-voice:hover {
            background-color: #e60000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #e1e4e8;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f1f3f5;
            color: #495057;
        }
        .total-row {
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
        }
        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            color: white;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-download { background-color: var(--success-color); }
        .btn-whatsapp { background-color: #25d366; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Durga Enterprises - Digital Slip</h2>
    
    <div class="form-group">
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" placeholder="Enter customer name">
    </div>
    
    <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" id="phoneNumber" placeholder="Enter phone number">
    </div>

    <div class="add-item-box">
        <label>Add Item Manually:</label>
        <div class="add-item-row">
            <input type="text" id="itemName" placeholder="Item Name">
            <input type="number" id="itemQty" class="small" placeholder="Qty" value="1" min="1">
            <input type="number" id="itemPrice" class="small" placeholder="Price (₹)" min="0">
        </div>
        <button class="btn-add" onclick="addItem()">+ Add Item to Slip</button>
    </div>

    <div class="voice-section">
        <button id="voiceBtn" class="btn-voice" onclick="startVoiceInput()">🎙️ Voice Input (बोलकर जोड़ें)</button>
    </div>

    <h3>Item List</h3>
    <table id="itemTable">
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Qty</th>
                <th>Price (₹)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic rows -->
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2" class="total-row">Total Amount:</td>
                <td colspan="2" id="totalAmount">₹0</td>
            </tr>
        </tfoot>
    </table>

    <div class="action-buttons">
        <button class="btn btn-download" onclick="downloadExcel()">📥 Download Excel</button>
        <button class="btn btn-whatsapp" onclick="sendWhatsApp()">💬 Send WhatsApp</button>
    </div>

    <div class="footer">Powered by Durga Enterprises</div>
</div>

<script>
    let items = []; // शुरुआत में लिस्ट खाली रहेगी

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let total = 0;

        items.forEach((item, index) => {
            let itemTotal = (item.qty || 0) * (item.price || 0);
            total += itemTotal;

            let row = `<tr>
                <td>${item.name}</td>
                <td>${item.qty}</td>
                <td><input type="number" value="${item.price || ''}" placeholder="Rate" style="width: 80px; padding: 4px;" oninput="updatePrice(${index}, this.value)"></td>
                <td><button class="btn-delete" onclick="deleteItem(${index})">✕</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalAmount').innerText = `₹${total}`;
    }

    function addItem() {
        const name = document.getElementById('itemName').value.trim();
        const qty = parseInt(document.getElementById('itemQty').value) || 1;
        const price = parseFloat(document.getElementById('itemPrice').value) || 0;

        if (!name) {
            alert("Please enter an item name.");
            return;
        }

        items.push({ name, qty, price });
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemQty').value = '1';
        renderTable();
    }

    function updatePrice(index, value) {
        items[index].price = parseFloat(value) || 0;
        renderTable();
    }

    function deleteItem(index) {
        items.splice(index, 1);
        renderTable();
    }

    // सुपर स्मार्ट वॉइस पार्सर (हिंदी और इंग्लिश दोनों के लिए)
    function parseVoiceText(text) {
        text = text.toLowerCase().trim();
        let numbers = text.match(/\d+/g);
        let qty = 1;
        let name = text;

        if (numbers && numbers.length > 0) {
            qty = parseInt(numbers[0]);
            name = text.replace(numbers[0], '').replace(/litre|liter|bag|bags|kg|pcs|पीस|लीटर|बैग|बोरा/g, '').trim();
        } else {
            if (text.includes('एक')) { qty = 1; name = text.replace('एक', ''); }
            else if (text.includes('दो')) { qty = 2; name = text.replace('दो', ''); }
            else if (text.includes('तीन')) { qty = 3; name = text.replace('तीन', ''); }
            else if (text.includes('चार')) { qty = 4; name = text.replace('चार', ''); }
        }

        name = name.replace(/litre|liter|bag|bags|kg|pcs|पीस|लीटर|बैग|बोरा/g, '').trim();
        if (!name) name = text;
        name = name.charAt(0).toUpperCase() + name.slice(1);

        return { name, qty };
    }

    function startVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Voice input is not supported in this browser. Please use Google Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN'; // हिंदी/इंग्लिश दोनों के लिए
        const btn = document.getElementById('voiceBtn');
        btn.innerText = "Listening... (बोलिए)";
        btn.style.backgroundColor = "#ffc107";

        recognition.onresult = function(event) {
            const speechResult = event.results[0][0].transcript;
            const parsed = parseVoiceText(speechResult);
            
            // सीधे बिना किसी पॉप-अप के टेबल में जुड़ेगा और प्राइस खाली रहेगा
            items.push({ name: parsed.name, qty: parsed.qty, price: 0 });
            renderTable();

            btn.innerText = "🎙️ Voice Input (बोलकर जोड़ें)";
            btn.style.backgroundColor = "#ff4d4d";
        };

        recognition.onerror = function() {
            btn.innerText = "🎙️ Voice Input (बोलकर जोड़ें)";
            btn.style.backgroundColor = "#ff4d4d";
        };

        recognition.onend = function() {
            btn.innerText = "🎙️ Voice Input (बोलकर जोड़ें)";
            btn.style.backgroundColor = "#ff4d4d";
        };

        recognition.start();
    }

    function downloadExcel() {
        const customerName = document.getElementById('customerName').value || "Customer";
        if (items.length === 0) {
            alert("Please add at least one item to export.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += `Customer Name: ${customerName}\n`;
        csvContent += `Phone Number: ${document.getElementById('phoneNumber').value}\n\n`;
        csvContent += "Item Name,Quantity,Price (₹),Total (₹)\n";

        let grandTotal = 0;
        items.forEach(item => {
            let p = item.price || 0;
            let rowTotal = item.qty * p;
            grandTotal += rowTotal;
            csvContent += `"${item.name}",${item.qty},${p},${rowTotal}\n`;
        });

        csvContent += `\n,,Grand Total,${grandTotal}`;

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `${customerName}_slip.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function sendWhatsApp() {
        const phone = document.getElementById('phoneNumber').value.trim();
        const name = document.getElementById('customerName').value.trim() || "Customer";
        
        if (!phone) {
            alert("Please enter a customer phone number first!");
            return;
        }
        if (items.length === 0) {
            alert("Please add items to the slip.");
            return;
        }

        let total = items.reduce((sum, item) => sum + (item.qty * (item.price || 0)), 0);
        let message = `*DURGA ENTERPRISES*\nDigital Bill/Slip\n\nCustomer: ${name}\n------------------\n`;
        
        items.forEach((item, i) => {
            let p = item.price || 0;
            message += `${i + 1}. ${item.name} (${item.qty} x ₹${p}) = ₹${item.qty * p}\n`;
        });
        
        message += `------------------\n*Total Amount: ₹${total}*\n\nThank you for shopping with us!`;

        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
    }

    renderTable();
</script>

</body>
</html>
